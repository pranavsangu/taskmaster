
spring.application.name=trustdesk

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trustdesk}
spring.datasource.username=${DB_USERNAME:trustdesk}
spring.datasource.password=${DB_PASSWORD:trustdesk}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# Extra SQL that Hibernate can't generate (full-text search column and index).
# Runs on every startup, after Hibernate has created/updated the tables.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/kb-search.sql

# JSON field names in API responses use snake_case (ticket_id), matching docs/API_CONTRACT.md.
spring.jackson.property-naming-strategy=SNAKE_CASE
# Every timestamp in API responses is shown in the business time zone (+05:30), including
# ones read back from the database (PostgreSQL returns them in UTC).
spring.jackson.time-zone=${trustdesk.business-time-zone}

# Folder with the course seed files (customers.json, knowledge_base/, ...).
# Relative paths are resolved from where the app is started (backend/).
trustdesk.data-dir=${TRUSTDESK_DATA_DIR:../trustdesk-capstone-main/data}

# The demo web page (plain HTML/JS in ../frontend), served at http://localhost:8080/.
# Relative paths are resolved from where the app is started (backend/).
trustdesk.frontend-dir=${TRUSTDESK_FRONTEND_DIR:../frontend}
spring.web.resources.static-locations=file:${trustdesk.frontend-dir}/

# Every API request must send "Authorization: Bearer <token>".
# The default is for local development only; set TRUSTDESK_DEMO_TOKEN anywhere else.
trustdesk.demo-token=${TRUSTDESK_DEMO_TOKEN:dev-token}

# AI provider: "mock" (default, offline, deterministic) or "groq".
trustdesk.ai.provider=${TRUSTDESK_AI_PROVIDER:mock}
# Groq settings, only used when trustdesk.ai.provider=groq. Never put the key in this file:
# set GROQ_API_KEY, or put trustdesk.ai.groq.api-key=... in backend/secrets.properties
# (git-ignored, read by the spring.config.import line at the bottom of this file).
trustdesk.ai.groq.api-key=${GROQ_API_KEY:}
trustdesk.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
trustdesk.ai.groq.base-url=https://api.groq.com/openai/v1
trustdesk.ai.groq.timeout-seconds=30

# Eval runner: pause between eval cases, to stay under the AI provider's rate limit
# (e.g. 15000 for Groq's free tier; 0 for the mock). Groq calls also retry HTTP 429 by themselves.
trustdesk.eval.pause-between-cases-ms=${TRUSTDESK_EVAL_PAUSE_MS:0}

# Time zone of the business (all seed data is Indian / INR). Used to show ticket times
# and, later, to calculate return and warranty windows.
trustdesk.business-time-zone=Asia/Kolkata

# Local secrets (e.g. the Groq API key). Optional: the app starts fine without the file.
# The path is relative to where the app is started (backend/); the file is git-ignored.
# Values in it override the ones above.
spring.config.import=optional:file:secrets.properties