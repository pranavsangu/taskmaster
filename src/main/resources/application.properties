spring.application.name=taskmaster

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskmaster}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.time-zone=UTC

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.attachments.storage-dir=${ATTACHMENTS_STORAGE_DIR:uploads}
app.attachments.max-size=${MAX_ATTACHMENT_SIZE:10485760}
spring.servlet.multipart.max-file-size=${MAX_ATTACHMENT_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_ATTACHMENT_SIZE:10MB}
